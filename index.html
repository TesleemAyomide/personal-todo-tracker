<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LockedIn - Personal To-do Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef1f6;
            color: #1f2430;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 32px 16px 64px;
        }
        .app { width: 100%; max-width: 640px; }

        /* Header */
        header {
            background: linear-gradient(135deg, #111827, #1e293b);
            color: #fff;
            border-radius: 14px 14px 0 0;
            padding: 22px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-badge {
            width: 46px; height: 46px;
            border-radius: 12px;
            background: #f59e0b;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
        }
        .logo-badge svg { width: 26px; height: 26px; stroke: #111827; }
        header h1 { font-size: 26px; letter-spacing: 0.5px; }
        header h1 span { color: #f59e0b; }
        header p { font-size: 13px; color: #9ca3af; margin-top: 2px; }

        /* Main card */
        .card {
            background: #fff;
            border-radius: 0 0 14px 14px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        /* Add task form */
        .add-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
        .add-row { display: flex; gap: 10px; }
        .add-row input[type="text"], .add-row input[type="date"], .add-row select {
            padding: 11px 12px;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            background: #f9fafb;
            color: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .add-row input:focus, .add-row select:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
            background: #fff;
        }
        #taskTitle { flex: 1; min-width: 0; }
        #taskDue { width: 158px; }
        #taskPriority { width: 120px; }
        #taskDesc { flex: 1; min-width: 0; }
        .add-btn {
            padding: 12px;
            background: #111827;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, transform 0.05s;
        }
        .add-btn:hover { background: #1f2937; }
        .add-btn:active { transform: scale(0.99); }
        .add-error { color: #dc2626; font-size: 13px; display: none; }

        /* Filters */
        .filters { display: flex; gap: 8px; margin-bottom: 18px; }
        .filter-btn {
            padding: 7px 16px;
            border: 1.5px solid #d1d5db;
            background: #fff;
            border-radius: 999px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            color: #4b5563;
            display: flex; align-items: center; gap: 6px;
            transition: all 0.15s;
        }
        .filter-btn:hover { border-color: #9ca3af; }
        .filter-btn.active {
            background: #111827;
            color: #fff;
            border-color: #111827;
            font-weight: 600;
        }
        .filter-btn .count {
            background: rgba(0,0,0,0.08);
            border-radius: 999px;
            padding: 0 8px;
            font-size: 12px;
            font-weight: 700;
        }
        .filter-btn.active .count { background: rgba(255,255,255,0.2); }

        /* Task list */
        .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .task-item {
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            transition: border-color 0.15s, opacity 0.2s, background 0.2s;
            overflow: hidden;
        }
        .task-item:hover { border-color: #cbd5e1; }
        .task-item.locked { background: #f9fafb; opacity: 0.75; }
        .lock-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
            flex-shrink: 0;
            color: #6b7280;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.15s, background 0.15s, transform 0.1s;
        }
        .lock-btn:hover { background: #f3f4f6; color: #111827; }
        .lock-btn:active { transform: scale(0.9); }
        .lock-btn svg { width: 22px; height: 22px; }
        .lock-btn.locked-btn { color: #f59e0b; }
        .lock-btn.locked-btn:hover { color: #d97706; }
        .task-body { flex: 1; min-width: 0; overflow: hidden; }
        .task-title { font-size: 15px; font-weight: 600; word-break: break-word; }
        .task-item.locked .task-title { text-decoration: line-through; color: #6b7280; }
        .task-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            font-size: 12.5px;
            color: #6b7280;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        .priority {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 2px 8px;
            border-radius: 999px;
        }
        .priority.low { background: #dcfce7; color: #15803d; }
        .priority.medium { background: #fef3c7; color: #b45309; }
        .priority.high { background: #fee2e2; color: #b91c1c; }
        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            color: #9ca3af;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.15s, background 0.15s;
        }
        .delete-btn:hover { color: #dc2626; background: #fef2f2; }
        .delete-btn svg { width: 18px; height: 18px; }
        .edit-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            color: #9ca3af;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.15s, background 0.15s;
        }
        .edit-btn:hover { color: #2563eb; background: #eff6ff; }
        .edit-btn svg { width: 18px; height: 18px; }
        .cancel-btn {
            padding: 12px;
            background: #fff;
            color: #4b5563;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
        }
        .cancel-btn:hover { border-color: #9ca3af; background: #f9fafb; }
        .add-btn.editing { background: #2563eb; }
        .add-btn.editing:hover { background: #1d4ed8; }
        .form-actions { display: flex; gap: 10px; }

        /* Empty state */
        .empty {
            text-align: center;
            padding: 44px 20px;
            color: #9ca3af;
        }
        .empty svg { width: 52px; height: 52px; margin-bottom: 14px; opacity: 0.5; }
        .empty h3 { color: #4b5563; font-size: 17px; margin-bottom: 4px; }
        .empty p { font-size: 14px; }

        /* Footer */
        .footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #6b7280;
        }
        .footer .stat strong { color: #111827; }

        @media (max-width: 768px) {
            .add-row { flex-wrap: wrap; }
            #taskDue { width: calc(50% - 5px); }
            #taskPriority { width: calc(50% - 5px); }
            .card { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="app">

    <header>
        <div class="logo-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <div>
            <h1>Locked<span>In</span></h1>
            <p>Personal To-do Tracker</p>
        </div>
    </header>

    <div class="card">

        <!-- Add task -->
        <form class="add-form" id="addForm">
            <div class="add-row">
                <input type="text" id="taskTitle" placeholder="Task title..." autocomplete="off">
                <input type="date" id="taskDue" title="Due date">
                <select id="taskPriority" title="Priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div class="add-row">
                <input type="text" id="taskDesc" placeholder="Description (optional)..." autocomplete="off">
            </div>
            <div class="form-actions">
                <button type="submit" class="add-btn">+ Lock In Task</button>
                <button type="button" class="cancel-btn" id="cancelBtn" style="display:none;">Cancel</button>
            </div>
            <p class="add-error" id="addError">Enter a task title first.</p>
        </form>

        <!-- Filters -->
        <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">All <span class="count" id="countAll">0</span></button>
            <button class="filter-btn" data-filter="open">Open <span class="count" id="countOpen">0</span></button>
            <button class="filter-btn" data-filter="locked">Locked <span class="count" id="countLocked">0</span></button>
        </div>

        <!-- Task list -->
        <ul class="task-list" id="taskList"></ul>

        <div class="empty" id="emptyState" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
            </svg>
            <h3 id="emptyTitle">Nothing locked in yet</h3>
            <p id="emptyText">Add your first task above.</p>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span class="stat"><strong id="statOpen">0</strong> open &middot; <strong id="statLocked">0</strong> locked</span>
        </div>

    </div>
</div>

<script>
(function () {
    'use strict';

    var STORAGE_KEY = 'lockedin.tasks';
    var tasks = load();
    var currentFilter = 'all';
    var editingId = null;

    // ---------- Helpers ----------
    function load() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            var parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
            return [];
        }
    }

    function save() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (e) {
            /* storage unavailable - app still works for the session */
        }
    }

    function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function formatDate(iso) {
        if (!iso) return null;
        var d = new Date(iso + 'T00:00:00');
        if (isNaN(d.getTime())) return null;
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // ---------- Icons ----------
    function lockIcon(locked) {
        if (locked) {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>' +
                '<path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';
        }
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>' +
            '<path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>';
    }

    function trashIcon() {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<polyline points="3 6 5 6 21 6"></polyline>' +
            '<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
    }

    function editIcon() {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>' +
            '<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>';
    }

    // ---------- Rendering ----------
    function visibleTasks() {
        if (currentFilter === 'open') return tasks.filter(function (t) { return !t.locked; });
        if (currentFilter === 'locked') return tasks.filter(function (t) { return t.locked; });
        return tasks;
    }

    function render() {
        var list = document.getElementById('taskList');
        var empty = document.getElementById('emptyState');
        var shown = visibleTasks();

        // Counts
        var open = tasks.filter(function (t) { return !t.locked; }).length;
        var locked = tasks.length - open;
        document.getElementById('countAll').textContent = tasks.length;
        document.getElementById('countOpen').textContent = open;
        document.getElementById('countLocked').textContent = locked;
        document.getElementById('statOpen').textContent = open;
        document.getElementById('statLocked').textContent = locked;

        // Empty state
        if (shown.length === 0) {
            list.innerHTML = '';
            empty.style.display = 'block';
            if (tasks.length === 0) {
                document.getElementById('emptyTitle').textContent = 'Nothing locked in yet';
                document.getElementById('emptyText').textContent = 'Add your first task above.';
            } else if (currentFilter === 'locked') {
                document.getElementById('emptyTitle').textContent = 'No locked tasks yet';
                document.getElementById('emptyText').textContent = 'Lock tasks as you finish them.';
            } else {
                document.getElementById('emptyTitle').textContent = 'All clear!';
                document.getElementById('emptyText').textContent = 'No open tasks right now.';
            }
            return;
        }
        empty.style.display = 'none';

        list.innerHTML = shown.map(function (t) {
            var due = formatDate(t.due);
            var meta = [];
            if (due) meta.push('<span>Due: ' + due + '</span>');
            meta.push('<span class="priority ' + escapeHtml(t.priority || 'medium') + '">' + escapeHtml(t.priority || 'medium') + '</span>');
            if (t.description) meta.push('<span>' + escapeHtml(t.description) + '</span>');

            return '<li class="task-item' + (t.locked ? ' locked' : '') + '" data-id="' + t.id + '">' +
                '<button class="lock-btn' + (t.locked ? ' locked-btn' : '') + '" data-action="toggle" title="' +
                (t.locked ? 'Mark as open' : 'Lock it in') + '">' + lockIcon(t.locked) + '</button>' +
                '<div class="task-body">' +
                    '<div class="task-title">' + escapeHtml(t.title) + '</div>' +
                    '<div class="task-meta">' + meta.join('') + '</div>' +
                '</div>' +
                '<button class="edit-btn" data-action="edit" title="Edit task">' + editIcon() + '</button>' +
                '<button class="delete-btn" data-action="delete" title="Delete task">' + trashIcon() + '</button>' +
                '</li>';
        }).join('');
    }

    // ---------- Actions ----------
    function addTask(title, desc, due, priority) {
        tasks.unshift({
            id: uid(),
            title: title,
            description: desc,
            due: due,
            priority: priority,
            locked: false,
            createdAt: new Date().toISOString()
        });
        save();
        render();
    }

    function toggleTask(id) {
        var t = tasks.find(function (x) { return x.id === id; });
        if (t) { t.locked = !t.locked; save(); render(); }
    }

    function deleteTask(id) {
        tasks = tasks.filter(function (x) { return x.id !== id; });
        save();
        render();
    }

    function startEdit(id) {
        var t = tasks.find(function (x) { return x.id === id; });
        if (!t) return;
        editingId = id;
        document.getElementById('taskTitle').value = t.title;
        document.getElementById('taskDesc').value = t.description || '';
        document.getElementById('taskDue').value = t.due || '';
        document.getElementById('taskPriority').value = t.priority || 'medium';
        var addBtn = document.querySelector('.add-btn');
        addBtn.textContent = 'Save Changes';
        addBtn.classList.add('editing');
        document.getElementById('cancelBtn').style.display = 'block';
        document.getElementById('addError').style.display = 'none';
        document.getElementById('taskTitle').focus();
        document.querySelector('.app').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function cancelEdit() {
        editingId = null;
        var addBtn = document.querySelector('.add-btn');
        addBtn.textContent = '+ Lock In Task';
        addBtn.classList.remove('editing');
        document.getElementById('cancelBtn').style.display = 'none';
        document.getElementById('addForm').reset();
        document.getElementById('taskPriority').value = 'medium';
        document.getElementById('addError').style.display = 'none';
    }

    function saveEdit(id, title, desc, due, priority) {
        var t = tasks.find(function (x) { return x.id === id; });
        if (!t) return;
        t.title = title;
        t.description = desc;
        t.due = due;
        t.priority = priority;
        save();
        cancelEdit();
        render();
    }

    // ---------- Events ----------
    document.getElementById('addForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var titleInput = document.getElementById('taskTitle');
        var err = document.getElementById('addError');
        var title = titleInput.value.trim();
        if (!title) {
            err.style.display = 'block';
            titleInput.focus();
            return;
        }
        err.style.display = 'none';
        var desc = document.getElementById('taskDesc').value.trim();
        var due = document.getElementById('taskDue').value;
        var priority = document.getElementById('taskPriority').value;
        if (editingId) {
            saveEdit(editingId, title, desc, due, priority);
        } else {
            addTask(title, desc, due, priority);
        }
        this.reset();
        document.getElementById('taskPriority').value = 'medium';
        titleInput.focus();
    });

    document.getElementById('taskTitle').addEventListener('input', function () {
        document.getElementById('addError').style.display = 'none';
    });

    document.getElementById('cancelBtn').addEventListener('click', function () {
        cancelEdit();
    });

    document.getElementById('taskList').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-action]');
        if (!btn) return;
        var li = btn.closest('.task-item');
        var id = li.getAttribute('data-id');
        if (btn.getAttribute('data-action') === 'toggle') toggleTask(id);
        else if (btn.getAttribute('data-action') === 'edit') startEdit(id);
        else if (btn.getAttribute('data-action') === 'delete') {
            if (confirm('Are you sure you want to delete this task?')) {
                deleteTask(id);
            }
        }
    });

    document.getElementById('filters').addEventListener('click', function (e) {
        var btn = e.target.closest('.filter-btn');
        if (!btn) return;
        currentFilter = btn.getAttribute('data-filter');
        var buttons = this.querySelectorAll('.filter-btn');
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.toggle('active', buttons[i] === btn);
        }
        render();
    });

    render();
})();
</script>
</body>
</html>
